[project]
name = "travel-planner-backend"
version = "0.1.0"
description = "Smart AI Travel Planner API: LLM place selection + geo-optimized walking routes"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "geoalchemy2>=0.16",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-genai>=2.0",
    "openai>=1.60",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "testcontainers[postgres]>=4.15",
    "httpx2>=2.16",  # transport for starlette's TestClient
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "ASYNC",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker (starts a PostGIS container)"]
