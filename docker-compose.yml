services:
  db:
    image: postgis/postgis:17-3.5
    container_name: travel-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-travel_planner}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Walking routes without the public OSRM server (osrm/): `docker compose --profile osrm
  # up -d`, then OSRM_BASE_URL=http://localhost:5000 in .env. The first build downloads ~20 GB.
  osrm:
    build: ./osrm
    image: travel-planner-osrm
    profiles: [osrm]
    restart: unless-stopped
    ports:
      - "${OSRM_PORT:-5000}:5000"

volumes:
  pgdata:
